<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuotaMonitor · 改造版</title>
  <style>
    /* ============================================================
       服务色系统：一个颜色只服务一个语义。
       低饱和哑光色调，所有服务色落在同一饱和度/明度带内，
       让多色在同一界面里像一个有意的家族，而不是彩虹。
       ============================================================ */
    :root {
      color-scheme: dark;

      /* 基底：冷蓝调深灰黑 */
      --desktop: #0a0c10;
      --desktop-deep: #0e1015;
      --background: #101318;
      --surface: #161a20;
      --surface-2: #1d222a;
      --surface-3: #272d37;
      --glass: rgba(20, 24, 31, .72);
      --glass-border: rgba(255, 255, 255, .06);

      --border: rgba(255, 255, 255, .06);
      --border-strong: rgba(255, 255, 255, .13);

      /* 文字 */
      --text: #e8ebf0;
      --text-2: #97a0ac;
      --text-3: #7b8593;

      /* 服务色：哑光宝石色 */
      --claude: #e0896b;      /* 暖陶土 */
      --claude-code: #d17b52; /* 深陶土 */
      --codex: #7cc5a3;       /* 鼠尾草绿 */
      --codex-deep: #5da983;
      --deepseek: #8ba4d8;    /* 灰蓝长春花 */
      --workbuddy: #b29bd6;   /* 淡紫 */
      --gpt: #d4b27e;         /* 哑金 */

      /* 状态 / 方向 */
      --ok: #69bd93;
      --ok-soft: rgba(105, 189, 147, .13);
      --warn: #dca869;
      --warn-soft: rgba(220, 168, 105, .14);
      --danger: #e07c6c;
      --danger-soft: rgba(224, 124, 108, .12);
      --up: #e07c6c;      /* 涨 = 红(消耗变多) */
      --down: #69bd93;    /* 跌 = 绿(消耗变少) */

      --shadow: 0 24px 70px rgba(0, 0, 0, .5), 0 4px 16px rgba(0, 0, 0, .32);
      --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 1120px; min-height: 760px; margin: 0; }
    body {
      overflow: hidden;
      background: var(--desktop);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 760px;
      overflow: hidden;
      background:
        radial-gradient(1000px 520px at 15% -10%, rgba(139, 164, 216, .08), transparent 62%),
        radial-gradient(900px 560px at 105% 100%, rgba(245, 184, 92, .07), transparent 60%),
        radial-gradient(700px 420px at 60% 120%, rgba(169, 138, 232, .06), transparent 55%),
        linear-gradient(160deg, #0f1116, #0a0b0f);
    }

    /* ============ 系统栏 ============ */
    .system-bar {
      position: relative;
      z-index: 20;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(15, 17, 22, .72);
      color: #b8bec9;
      font-size: 12.5px;
      font-weight: 500;
      backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--glass-border);
    }
    .system-left, .system-right, .status-slots { display: flex; align-items: center; gap: 18px; }
    .apple { font-size: 16px; line-height: 1; filter: drop-shadow(0 0 6px rgba(255,255,255,.15)); }
    .app-name { font-weight: 650; color: #eef1f6; }
    .sys-item { opacity: .8; }
    .sys-item:hover { opacity: 1; }
    .status-button {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--glass-border);
      border-radius: 9px;
      background: rgba(255, 255, 255, .04);
      cursor: pointer;
      user-select: none;
      transition: background .15s;
    }
    .status-button:hover { background: rgba(255, 255, 255, .08); }
    .status-slot { display: flex; align-items: center; gap: 7px; color: #eef1f6; font-variant-numeric: tabular-nums; }
    .status-icon { position: relative; width: 18px; height: 18px; display: inline-grid; place-items: center; }
    .status-icon svg { width: 100%; height: 100%; fill: #7cc5a3; }
    .status-icon.claude svg { width: 15px; height: 15px; }
    .status-icon .route-dot {
      position: absolute; top: 1px; right: -1px; width: 7px; height: 7px;
      border: 1.5px solid #0f1116; border-radius: 50%; background: var(--deepseek);
      box-shadow: 0 0 0 0 rgba(139, 164, 216, .55);
      animation: routePulse 2.6s ease-out infinite;
    }
    @keyframes routePulse {
      0% { box-shadow: 0 0 0 0 rgba(139, 164, 216, .5); }
      70% { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .status-text { font-size: 11px; color: var(--text-3); }
    .status-divider { width: 1px; height: 14px; background: var(--border-strong); }

    /* ============ 工作区 ============ */
    .workspace { position: relative; z-index: 2; width: 100%; height: calc(100% - 46px); }

    /* ============ 下拉面板 ============ */
    .dropdown {
      position: absolute;
      z-index: 12;
      top: 14px;
      right: 16px;
      width: 400px;
      max-height: calc(100vh - 70px);
      overflow: auto;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(1.5);
      box-shadow: var(--shadow);
      color: var(--text);
      scrollbar-width: none;
      padding-bottom: 8px;
    }
    .dropdown::-webkit-scrollbar { display: none; }
    .dropdown.hidden, .main-panel.hidden { display: none; }
    .dropdown-head { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 4px; }
    .dropdown-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .updated { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }

    .hero {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      padding: 6px 20px 16px;
    }
    .hero-value { font-size: 40px; font-weight: 700; letter-spacing: -1.5px; font-family: var(--mono); color: #f5f7fb; line-height: 1.1; }
    .hero-label { color: var(--text-2); font-size: 11px; }
    .comparison { font-size: 11px; font-weight: 650; font-family: var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--down) 18; background: var(--ok-soft); color: var(--ok); }

    .section-label { padding: 8px 20px 6px; color: var(--text-3); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; }
    .quota-line { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 12px; padding: 10px 20px; }
    .quota-name { display: flex; gap: 10px; align-items: flex-start; }
    .quota-name .brand { width: 20px; height: 20px; margin-top: 1px; }
    .quota-name strong { display: block; font-size: 12.5px; font-weight: 650; }
    .quota-name small { display: block; margin-top: 3px; color: var(--text-3); font-size: 10px; }
    .metric { min-width: 0; }
    .metric-head { display: flex; justify-content: space-between; gap: 4px; align-items: baseline; }
    .metric-label { color: var(--text-3); font-size: 10.5px; }
    .metric-value { font-size: 13px; font-weight: 650; font-family: var(--mono); }
    .metric-detail { margin-top: 4px; color: var(--text-3); font-size: 10px; white-space: nowrap; }

    .compact-row {
      display: grid; grid-template-columns: 1fr 72px 46px; gap: 8px; align-items: baseline;
      padding: 5px 20px;
    }
    .compact-row .name { overflow: hidden; color: var(--text-2); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .compact-row .amount { text-align: right; font-size: 12px; font-family: var(--mono); color: var(--text); font-weight: 550; }
    .compact-row .share { color: var(--text-3); text-align: right; font-size: 10.5px; font-family: var(--mono); }

    .dropdown-actions { display: grid; gap: 2px; margin-top: 12px; padding: 6px 0; border-top: 1px solid var(--border); }
    .dropdown-action { width: 100%; padding: 10px 20px; border: 0; background: transparent; text-align: left; cursor: pointer; font-size: 12.5px; color: var(--text-2); transition: background .12s, color .12s; }
    .dropdown-action:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .dropdown-action.quit { color: var(--danger); }
    .dropdown-action.quit:hover { background: var(--danger-soft); }

    /* ============ 主面板 ============ */
    .main-panel {
      position: absolute;
      z-index: 10;
      top: 50%; left: 50%;
      width: 1000px; height: min(680px, calc(100vh - 80px)); max-height: calc(100vh - 80px);
      transform: translate(-50%, -48%);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      background: var(--background);
      box-shadow: var(--shadow);
    }
    .titlebar { height: 46px; display: flex; align-items: center; padding: 0 18px; background: rgba(17, 19, 24, .85); cursor: default; border-bottom: 1px solid var(--border); }
    .traffic { display: flex; gap: 9px; }
    .traffic button { width: 13px; height: 13px; padding: 0; border: 0; border-radius: 50%; display: block; cursor: pointer; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
    .traffic button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .traffic .close { background: #ff5f57; } .traffic .min { background: #febc2e; } .traffic .max { background: #28c840; }
    .titlebar-title { flex: 1; text-align: center; color: var(--text-2); font-size: 12.5px; font-weight: 600; }
    .titlebar-status { display: flex; align-items: center; gap: 6px; width: 120px; justify-content: flex-end; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(105,189,147,.5); animation: healthPulse 2.6s ease-out infinite; }
    @keyframes healthPulse {
      0% { box-shadow: 0 0 0 0 rgba(105,189,147,.45); }
      70% { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .panel-body { display: flex; width: 100%; height: calc(100% - 46px); }
    .sidebar {
      width: 176px; flex: 0 0 176px;
      display: flex; flex-direction: column;
      background: rgba(20, 22, 28, .6);
      border-right: 1px solid var(--border);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 18px; }
    .sidebar-brand .brand-tile { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: rgba(124, 197, 163, .14); }
    .sidebar-brand .brand-tile .brand { width: 19px; height: 19px; }
    .sidebar-brand strong { font-size: 14px; font-weight: 700; letter-spacing: .2px; }
    .side-nav { display: grid; gap: 4px; padding: 0 12px; }
    .side-nav button {
      display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 13px;
      border: 0; border-radius: 10px; background: transparent; color: var(--text-2);
      text-align: left; cursor: pointer; font-size: 12.5px; transition: background .12s, color .12s;
    }
    .side-nav button:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .side-nav button.active { background: rgba(124, 197, 163, .13); color: #9fd6ba; font-weight: 650; }
    .side-nav .nav-symbol { width: 17px; text-align: center; font-size: 15px; opacity: .9; }
    .connection {
      margin-top: auto; padding: 14px 18px 18px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 9px;
    }
    .connection .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
    .connection strong { display: block; color: var(--text-2); font-size: 11px; font-weight: 650; }
    .connection small { display: block; margin-top: 2px; overflow: hidden; color: var(--text-3); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

    .panel-content { flex: 1; min-width: 0; overflow: auto; padding: 18px 22px 22px; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
    .panel-content::-webkit-scrollbar { width: 8px; }
    .panel-content::-webkit-scrollbar-track { background: transparent; }
    .panel-content::-webkit-scrollbar-thumb { background: var(--surface-3); border: 2px solid var(--background); border-radius: 99px; }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn .18s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ============ 概览页 ============ */
    .page-heading { margin-bottom: 16px; }
    .page-heading h1 { margin: 0 0 4px; color: var(--text); font-size: 21px; line-height: 1.2; font-weight: 750; letter-spacing: -.4px; }
    .page-heading p { margin: 0; color: var(--text-2); font-size: 12px; }

    /* 概览 Hero 条：紧凑信息条，数据密度优先 */
    .hero-card {
      display: grid; grid-template-columns: auto 1fr auto; gap: 18px 24px; align-items: center;
      padding: 16px 18px; margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }
    .hero-card .hc-main { display: flex; flex-direction: column; gap: 1px; }
    .hero-card .hc-label { color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .hero-card .hc-value { font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: -1px; color: #f5f7fb; line-height: 1.1; }
    .hero-card .hc-sub { color: var(--text-2); font-size: 11px; font-variant-numeric: tabular-nums; }
    .hero-card .hc-badge {
      justify-self: start; width: max-content;
      font-family: var(--mono); font-size: 11.5px; font-weight: 650; padding: 4px 9px; border-radius: 6px;
      background: var(--ok-soft); color: var(--ok); white-space: nowrap;
    }
    .hero-card .hc-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; grid-column: 1 / -1; margin-top: 2px; }
    .hc-fact { display: flex; flex-direction: column; }
    .hc-fact label { color: var(--text-3); font-size: 10px; letter-spacing: .03em; }
    .hc-fact strong { margin-top: 2px; color: var(--text); font-size: 16px; font-weight: 650; font-family: var(--mono); font-variant-numeric: tabular-nums; }

    .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .grid-bottom { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 14px 16px;
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { color: var(--text); font-size: 12.5px; font-weight: 650; letter-spacing: .2px; }
    .card-note { color: var(--text-3); font-size: 10.5px; white-space: nowrap; }

    .quota-card { min-width: 0; }
    .quota-card-top { display: flex; align-items: center; gap: 10px; }
    .quota-card-top .brand { width: 24px; height: 24px; }
    .quota-card-top .brand.claude { width: 22px; height: 22px; }
    .quota-card-top strong { display: block; font-size: 13px; font-weight: 650; }
    .quota-card-top small { display: block; margin-top: 2px; color: var(--text-3); font-size: 10px; }
    .status-pill {
      margin-left: auto; padding: 4px 9px; border-radius: 7px;
      font-size: 10px; font-weight: 650;
      background: var(--ok-soft); color: var(--ok);
    }
    .status-pill.off { background: rgba(255,255,255,.06); color: var(--text-3); }
    .status-pill.neutral { background: var(--warn-soft); color: var(--warn); }
    .quota-facts { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .quota-facts .divider { background: var(--border); }
    .fact label { display: block; color: var(--text-3); font-size: 10px; }
    .fact strong { display: block; margin-top: 3px; color: var(--text); font-size: 19px; font-weight: 650; font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .fact small { display: block; margin-top: 2px; overflow: hidden; color: var(--text-2); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

    .trend-total { margin-top: 8px; color: var(--text); font-size: 26px; font-weight: 700; font-family: var(--mono); letter-spacing: -1px; }
    .canvas-wrap { height: 120px; margin-top: 4px; }
    canvas, .chart-svg { display: block; width: 100%; height: 100%; }

    .list-card { display: grid; gap: 9px; align-content: start; }
    .list-row { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.05); }
    .list-row:last-child { border-bottom: 0; }
    .list-row .label { flex: 1; overflow: hidden; color: var(--text); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .label .dot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
    .list-row .amount { color: var(--text-2); font-size: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .list-row .share { width: 46px; color: var(--text-3); text-align: right; font-size: 11px; font-family: var(--mono); }

    /* ============ Token 看板页 ============ */
    .token-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .token-heading .page-heading { flex: 1; margin: 0; }
    .period-picker { display: flex; gap: 3px; padding: 4px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); }
    .period-picker button {
      padding: 6px 12px; border: 0; border-radius: 8px; background: transparent;
      color: var(--text-2); cursor: pointer; font-size: 11.5px; transition: background .12s, color .12s;
    }
    .period-picker button.active { background: var(--surface-3); color: var(--text); font-weight: 650; }
    .period-picker button:disabled { color: var(--text-3); cursor: not-allowed; opacity: .58; }
    .period-picker button:disabled:hover { background: transparent; }

    .metric-strip {
      display: grid; grid-template-columns: 1.35fr repeat(4, 1fr);
      margin-bottom: 12px; overflow: hidden;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface);
    }
    .metric-cell { min-width: 0; padding: 12px 16px; border-right: 1px solid var(--border); }
    .metric-cell:last-child { border-right: 0; }
    .metric-cell label { display: block; color: var(--text-3); font-size: 10px; font-weight: 600; letter-spacing: .04em; }
    .metric-cell strong {
      display: block; overflow: hidden; margin-top: 4px; color: var(--text);
      font-size: 17px; font-weight: 650; font-family: var(--mono); letter-spacing: -.4px;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .metric-cell:first-child strong { font-size: 22px; color: #f7f8fb; }

    .chart-card { margin-bottom: 12px; }
    .chart-subtitle { color: var(--text-3); font-size: 10.5px; }
    .chart-empty { display: grid; place-items: center; height: 130px; color: var(--text-2); font-size: 11px; text-align: center; }
    .chart-legend { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 8px; color: var(--text-2); font-size: 11px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 9px; height: 9px; border-radius: 3px; }

    .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .rank-card { min-width: 0; }
    .rank-list { display: grid; gap: 10px; margin-top: 12px; }
    .rank-row {
      display: grid; grid-template-columns: 130px 1fr 70px 44px; align-items: center; gap: 10px;
    }
    .rank-row .name { overflow: hidden; font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .rank-track { height: 5px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.07); }
    .rank-track i { display: block; height: 100%; border-radius: inherit; transition: filter .2s; }
    .rank-row .num { color: var(--text-2); text-align: right; font-size: 11px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .rank-row .pct { color: var(--text-3); text-align: right; font-size: 11px; font-family: var(--mono); }

    .heatmap-card { margin-bottom: 4px; }
    .heatmap-legend { display: flex; align-items: center; gap: 5px; color: var(--text-3); font-size: 10px; }
    .heatmap-legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--surface-2); }
    .heatmap-legend i:nth-of-type(2) { background: color-mix(in srgb, var(--codex) 22%, var(--surface)); }
    .heatmap-legend i:nth-of-type(3) { background: color-mix(in srgb, var(--codex) 45%, var(--surface)); }
    .heatmap-legend i:nth-of-type(4) { background: color-mix(in srgb, var(--codex) 70%, var(--surface)); }
    .heatmap-legend i:nth-of-type(5) { background: var(--codex); }
    .heatmap-meta { display: flex; align-items: center; gap: 14px; }
    .heatmap { display: grid; grid-template-columns: 20px minmax(0, 1fr); grid-template-rows: 14px 84px; column-gap: 8px; row-gap: 5px; margin-top: 10px; }
    .heatmap-months { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(53, minmax(0, 1fr)); min-width: 0; color: var(--text-3); font-size: 9px; }
    .heatmap-months span { white-space: nowrap; }
    .weekday-labels { grid-column: 1; grid-row: 2; display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; width: 20px; color: var(--text-3); font-size: 9px; }
    .heatmap-grid { grid-column: 2; grid-row: 2; display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, minmax(0, 1fr)); grid-template-columns: repeat(53, minmax(0, 1fr)); gap: 3px; min-width: 0; overflow: hidden; }
    .heat-cell { min-width: 0; min-height: 0; border-radius: 2px; background: var(--surface-2); }
    .heat-cell.l1 { background: color-mix(in srgb, var(--codex) 22%, var(--surface)); }
    .heat-cell.l2 { background: color-mix(in srgb, var(--codex) 45%, var(--surface)); }
    .heat-cell.l3 { background: color-mix(in srgb, var(--codex) 70%, var(--surface)); }
    .heat-cell.l4 { background: var(--codex); }

    /* ============ 设置页 ============ */
    .settings-card { max-width: 720px; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .settings-title { padding: 12px 16px; color: var(--text); font-size: 11.5px; font-weight: 650; border-bottom: 1px solid var(--border); }
    .setting-row { display: flex; align-items: center; gap: 16px; min-height: 52px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-copy { flex: 1; min-width: 0; }
    .setting-copy strong { display: block; font-size: 12.5px; font-weight: 550; }
    .setting-copy small { display: block; margin-top: 3px; color: var(--text-3); font-size: 10.5px; }
    .toggle { position: relative; width: 38px; height: 22px; flex: 0 0 38px; border: 0; border-radius: 99px; background: var(--surface-3); cursor: pointer; transition: background .15s; }
    .toggle:after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #eef1f6; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .18s ease; }
    .toggle.on { background: var(--codex); }
    .toggle.on:after { transform: translateX(16px); background: #fff; }
    .segmented { display: flex; gap: 3px; padding: 4px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); }
    .segmented button { padding: 6px 14px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; font-size: 12px; font-weight: 600; }
    .segmented button.active { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.25); }

    .main-panel.maximized { width: calc(100% - 40px); height: calc(100% - 80px); transform: translate(-50%, -50%); border-radius: 12px; }
    .status-icon.monitor-mark { width: 18px; height: 18px; border-radius: 5px; background: rgba(124,197,163,.16); color: var(--codex); font-size: 10px; font-weight: 800; line-height: 18px; text-align: center; }
    @media (max-height: 780px) { .main-panel { transform: translate(-50%, -50%) scale(.94); } }

    // 通用 SVG 折线图：服务色多线，带"当前时刻"光标
    function drawSparkline(svg, values, color) {
      if (!svg) return;
      const width = 600, height = 120, pad = 8;
      const max = Math.max(...values, 1), min = Math.min(...values), range = Math.max(max - min, 1);
      const points = values.map((value, index) => [index * width / Math.max(values.length - 1, 1), height - ((value - min) / range) * (height - 20) - pad]);
      const pathFor = close => {
        let path = `M ${points[0][0]} ${points[0][1]}`;
        for (let index = 0; index < points.length - 1; index++) {
          const a = points[index - 1] || points[index], b = points[index], c = points[index + 1], d = points[index + 2] || c;
          path += ` C ${b[0] + (c[0] - a[0]) / 6} ${b[1] + (c[1] - a[1]) / 6}, ${c[0] - (d[0] - b[0]) / 6} ${c[1] - (d[1] - b[1]) / 6}, ${c[0]} ${c[1]}`;
        }
        return close ? `${path} L ${width} ${height} L 0 ${height} Z` : path;
      };
      const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
      const text3 = getComputedStyle(document.documentElement).getPropertyValue('--text-3').trim();
      svg.innerHTML = `
        <g stroke="${border}" stroke-width="1">${[0,1,2,3].map(index => `<line x1="0" y1="${index * height / 3}" x2="${width}" y2="${index * height / 3}"></line>`).join('')}</g>
        <path d="${pathFor(true)}" fill="${color}" fill-opacity=".14"></path>
        <path d="${pathFor(false)}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        ${points.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="3" fill="var(--surface)" stroke="${color}" stroke-width="2"></circle>`).join('')}
        <line x1="${points[points.length-1][0]}" y1="0" x2="${points[points.length-1][0]}" y2="${height}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="3 4" opacity=".7"></line>`;
    }

    // 按模型类型拆分每日数据。平台（Codex / Claude 等）与模型类型（GPT / DeepSeek 等）是两个维度。
    function modelFamilyStackFor(values, labels) {
      const modelTotal = DATA.models.reduce((s, r) => s + r[1], 0);
      const familyShares = {
        'Codex': (DATA.models.filter(m => ['codex-auto-review'].includes(m[0])).reduce((s, r) => s + r[1], 0)) / modelTotal,
        'DeepSeek': (DATA.models.filter(m => m[0].startsWith('deepseek')).reduce((s, r) => s + r[1], 0)) / modelTotal,
        'GPT': (DATA.models.filter(m => m[0].startsWith('gpt')).reduce((s, r) => s + r[1], 0)) / modelTotal,
        'Claude': (DATA.models.filter(m => m[0].startsWith('claude') || m[0] === 'unknown').reduce((s, r) => s + r[1], 0)) / modelTotal
      };
      const base = Object.values(familyShares).reduce((a, b) => a + b, 0) || 1;
      const stack = Object.keys(familyShares).map(k => ({
        name: k,
        share: familyShares[k] / base
      }));
      const perDayShare = values.map(v => stack.map(s => ({ name: s.name, value: v * s.share })));
      return perDayShare;
    }

      const lines = [0, 1, 2, 3].map(index => {
        const y = top + plotH * index / 3;
        return `<line x1="${left}" y1="${y}" x2="${width - 8}" y2="${y}" stroke="${grid}" stroke-width="1" ${index === 3 ? '' : 'stroke-dasharray="3 4"'}></line><text x="${left - 8}" y="${y + 3}" text-anchor="end" fill="${text}" font-size="10" font-family="var(--mono)">${formatTokens(peak * (3 - index) / 3)}</text>`;
      }).join('');
      const stack = modelFamilyStackFor(values, labels);
      const slot = plotW / Math.max(values.length, 1), barWidth = Math.min(26, Math.max(slot * .6, 6));
      const bars = stack.map((layers, index) => {
        const x = left + index * slot + (slot - barWidth) / 2;
        const isToday = index === values.length - 1;
        let yCursor = top + plotH;
        const rects = layers.map(layer => {
          const h = layer.value ? Math.max(layer.value / peak * plotH, layer.value > 0 ? 1 : 0) : 0;
          yCursor -= h;
          if (!h) return '';
          return `<rect x="${x}" y="${yCursor}" width="${barWidth}" height="${h}" rx="1.5" fill="${colors[layer.name] || 'var(--text-3)'}"></rect>`;
        }).join('');
        const outline = isToday ? `<rect x="${x}" y="${top}" width="${barWidth}" height="${plotH}" rx="2" fill="none" stroke="var(--warn)" stroke-width="1.2" opacity=".8"></rect>` : '';
        return rects + outline;
      }).join('');
      const axis = labels.map((label, index) =>
        index === 0 || index === labels.length - 1 || index === Math.floor(labels.length / 2)
          ? `<text x="${left + index * slot + slot / 2}" y="${height - 2}" text-anchor="middle" fill="${text}" font-size="10" font-family="var(--mono)">${label}</text>` : '').join('');
      svg.innerHTML = `<g font-family="-apple-system, BlinkMacSystemFont, sans-serif">${lines}${bars}${axis}</g>`;
    }

    function renderOverview() {
      const total = DATA.days.reduce((a, b) => a + b, 0), delta = ((DATA.today - DATA.yesterday) / DATA.yesterday * 100).toFixed(1);
      const isDown = DATA.today < DATA.yesterday;
      const deltaColor = isDown ? 'var(--ok)' : 'var(--danger)';
      $('#page-overview').innerHTML = `
        <div class="page-heading"><h1>概览</h1></div>
        <div class="hero-card">
          <div class="hc-main">
            <span class="hc-label">今日 Token 消耗</span>
            <span class="hc-value">${formatTokens(DATA.today)}</span>
            <span class="hc-sub">昨日 ${formatTokens(DATA.yesterday)} · 更新 ${DATA.updated}</span>
          </div>
          <span class="hc-badge" style="background:${isDown ? 'var(--ok-soft)' : 'var(--danger-soft)'};color:${deltaColor}">${isDown ? '↓' : '↑'} ${Math.abs(delta)}% 较昨日</span>
          <div class="hc-facts">
            <div class="hc-fact"><label>近 7 日累计</label><strong>${formatTokens(total)}</strong></div>
            <div class="hc-fact"><label>今日峰值占比</label><strong>${percent(DATA.today, Math.max(total,1))}</strong></div>
            <div class="hc-fact"><label>用量领先模型</label><strong style="font-size:15px">${DATA.models[0][0]}</strong></div>
          </div>
        </div>
        <div class="grid-two">
          <div class="card quota-card"><div class="quota-card-top">${brand('codex')}<div><strong>Codex</strong><small>官方额度 · 已连接</small></div><span class="status-pill neutral">额度未读取</span></div><div class="quota-facts"><div class="fact"><label>会话额度</label><strong>--</strong><small>额度未读取</small></div><div class="divider"></div><div class="fact"><label>周额度</label><strong>--</strong><small>额度未读取</small></div></div></div>
          <div class="card quota-card"><div class="quota-card-top">${brand('claude', 'claude')}<div><strong>Claude</strong><small>未连接</small></div><span class="status-pill off">未连接</span></div><div class="quota-facts"><div class="fact"><label>会话额度</label><strong>--</strong><small>未连接</small></div><div class="divider"></div><div class="fact"><label>周额度</label><strong>--</strong><small>未连接</small></div></div></div>
        </div>
        <div class="grid-bottom">
          <div class="card"><div class="card-head"><span class="card-title">近 7 日 Token</span><span class="card-note">按天累计</span></div><div class="trend-total">${formatTokens(total)}</div><div class="canvas-wrap"><svg id="overviewSpark" class="chart-svg" viewBox="0 0 600 120" preserveAspectRatio="none" aria-label="近 7 日 Token 折线图"></svg></div></div>
          <div style="display:grid;gap:14px">
            <div class="card list-card"><div class="card-head"><span class="card-title">平台用量</span><span class="card-note">近 7 日</span></div><div class="list-row"><span class="label"><span class="dot" style="background:var(--codex)"></span>Codex</span><span class="amount">${formatTokens(total)}</span><span class="share">100.0%</span></div></div>
            <div class="card list-card"><div class="card-head"><span class="card-title">模型用量</span><span class="card-note">近 7 日</span></div>${DATA.models.slice(0,3).map(row => `<div class="list-row"><span class="label"><span class="dot" style="background:${SERVICE_COLOR[row[0]] || 'var(--text-3)'}"></span>${row[0]}</span><span class="amount">${formatTokens(row[1])}</span><span class="share">${percent(row[1], DATA.models.reduce((s,r)=>s+r[1],0))}</span></div>`).join('')}</div>
          </div>
        </div>`;
      mountIcons($('#page-overview'));
    }

    function periodDays() {
      const count = state.period === '7' ? 7 : state.period === '30' ? 30 : state.period === '90' ? 90 : 365;
      const values = Array(count).fill(0);
      DATA.days.slice(-count).forEach((value, index) => values[count - DATA.days.slice(-count).length + index] = value);
      const labels = values.map((_, i) => { const d = new Date(2026, 7, 12 - count + i); return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); });
      return { values, labels };
    }

    function buildHeatmap() {
      const end = new Date(2026, 7, 11);
      const rangeStart = new Date(end);
      rangeStart.setDate(end.getDate() - 364);
      const leading = (rangeStart.getDay() + 6) % 7;
      const alignedStart = new Date(rangeStart);
      alignedStart.setDate(rangeStart.getDate() - leading);
      const weekCount = Math.ceil((leading + 365) / 7);
      const trailing = weekCount * 7 - leading - 365;
      const values = Array(leading).fill(0)
        .concat(Array(Math.max(0, 365 - DATA.days.length)).fill(0), DATA.days.slice(-365))
        .concat(Array(trailing).fill(0));
      const monthTicks = [];
      const cursor = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
      while (cursor <= end) {
        const column = Math.max(1, Math.min(weekCount, Math.floor((cursor - alignedStart) / 604800000) + 1));
        monthTicks.push(`<span style="grid-column:${column}">${cursor.getMonth() + 1}月</span>`);
        cursor.setMonth(cursor.getMonth() + 1);
      }
      return { values, monthTicks: monthTicks.join('') };
    }

    function renderTokens() {
      const {values, labels} = periodDays(), total = values.reduce((a,b)=>a+b,0), peak = Math.max(...values,0), avg = Math.round(total / Math.max(values.filter(Boolean).length, 1));
      const periodCount = state.period === '7' ? 7 : state.period === '30' ? 30 : state.period === '90' ? 90 : 365;
      const hasPeriodData = state.period === '7' || DATA.days.length >= periodCount;
      const topModels = DATA.models.slice(0,4); const modelTotal = DATA.models.reduce((s,r)=>s+r[1],0); const other = DATA.models.slice(4).reduce((s,r)=>s+r[1],0);
      const rank = rows => rows.map(row => {
        const color = SERVICE_COLOR[row[0]] || 'var(--codex)';
        return `<div class="rank-row"><span class="name">${row[0]}</span><span class="rank-track"><i style="width:${Math.max(2,row[1]/Math.max(...rows.map(r=>r[1]),1)*100)}%;background:${color}"></i></span><span class="num">${formatTokens(row[1])}</span><span class="pct">${percent(row[1], total || modelTotal)}</span></div>`;
      }).join('');
      const heat = buildHeatmap();
      const cells = heat.values.map(v => {
        const level = v === 0 ? '' : v > 150000000 ? 'l4' : v > 90000000 ? 'l3' : v > 50000000 ? 'l2' : 'l1';
        return `<i class="heat-cell ${level}" title="${formatRaw(v)} token"></i>`;
      }).join('');
      $('#page-tokens').innerHTML = `
        <div class="token-heading"><div class="page-heading"><h1>Token 看板</h1></div><div class="period-picker">${[['7','近 7 日',true],['30','近 30 日',DATA.days.length >= 30],['90','近 90 日',DATA.days.length >= 90],['all','累计',DATA.days.length >= 365]].map(([id,label,available])=>`<button class="${state.period===id?'active':''}" data-period="${id}" ${available?'':'disabled'} title="${available?'切换时间范围':'当前仅有近 7 日数据'}">${label}</button>`).join('')}</div></div>
        <div class="metric-strip">
          <div class="metric-cell"><label>总用量</label><strong>${hasPeriodData ? formatTokens(total) : '--'}</strong></div>
          <div class="metric-cell"><label>有效日均</label><strong>${hasPeriodData ? formatTokens(avg) : '--'}</strong></div>
          <div class="metric-cell"><label>峰值</label><strong>${hasPeriodData ? formatTokens(peak) : '--'}</strong></div>
          <div class="metric-cell"><label>最高平台</label><strong>Codex</strong></div>
          <div class="metric-cell"><label>最高模型</label><strong>${topModels[0][0]}</strong></div>
        </div>
        <div class="card chart-card">
          <div class="card-head"><span class="card-title">模型类型趋势</span><span class="chart-subtitle">按天累计 · 峰值 ${hasPeriodData ? formatTokens(peak) : '--'}</span></div>
          <div class="canvas-wrap" style="height:130px">${hasPeriodData ? '<svg id="tokenBars" class="chart-svg" viewBox="0 0 760 130" preserveAspectRatio="none" aria-label="模型类型趋势柱状图"></svg>' : '<div class="chart-empty">当前仅有近 7 日数据<br>补充历史数据后可查看该时间范围</div>'}</div>
          <div class="chart-legend"><span class="legend-item"><i class="swatch" style="background:var(--codex)"></i>Codex 模型</span><span class="legend-item"><i class="swatch" style="background:var(--deepseek)"></i>DeepSeek</span><span class="legend-item"><i class="swatch" style="background:var(--gpt)"></i>GPT</span><span class="legend-item"><i class="swatch" style="background:var(--claude)"></i>Claude</span></div>
        </div>
        <div class="rank-grid">
          <div class="card rank-card"><div class="card-head"><span class="card-title">平台用量</span><span class="card-note">客户端</span></div><div class="rank-list">${rank([['Codex', total]])}</div></div>
          <div class="card rank-card"><div class="card-head"><span class="card-title">模型用量</span><span class="card-note">模型类型</span></div><div class="rank-list">${rank(topModels.map(row => [row[0], row[1]]).concat(other ? [['其他', other]] : []))}</div></div>
        </div>
        <div class="card heatmap-card"><div class="card-head"><span class="card-title">365 天 Token 用量</span><div class="heatmap-meta"><span class="card-note">已记录 ${DATA.days.length} 天</span><div class="heatmap-legend"><span>少</span><i></i><i></i><i></i><i></i><i></i><span>多</span></div></div></div><div class="heatmap"><div class="heatmap-months">${heat.monthTicks}</div><div class="weekday-labels"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div><div class="heatmap-grid">${cells}</div></div></div>`;
      $$('.period-picker button').forEach(button => button.addEventListener('click', () => { state.period = button.dataset.period; renderTokens(); requestAnimationFrame(drawCharts); }));
    }

    function renderSettings() {
      $('#page-settings').innerHTML = `
        <div class="page-heading"><h1>设置</h1></div>
        <div class="settings-card">
          <div class="setting-row"><div class="setting-copy"><strong>开机启动</strong><small>登录后显示额度状态</small></div><button class="toggle ${state.launch ? 'on' : ''}" id="launchToggle" aria-label="开机启动"></button></div>
          <div class="setting-row"><div class="setting-copy"><strong>语言</strong><small>选择界面语言</small></div><div class="segmented"><button class="${state.language==='zh'?'active':''}" data-lang="zh">简体中文</button><button class="${state.language==='en'?'active':''}" data-lang="en">English</button></div></div>
        </div>`;
      $('#launchToggle').addEventListener('click', () => { state.launch = !state.launch; renderSettings(); });
      $$('.segmented button').forEach(button => button.addEventListener('click', () => { state.language = button.dataset.lang; renderSettings(); }));
    }

    function drawCharts() {
      if ($('#mainPanel').classList.contains('hidden')) return;
      const css = getComputedStyle(document.documentElement);
      const codex = css.getPropertyValue('--codex').trim();
      if (state.page === 'overview') drawSparkline($('#overviewSpark'), DATA.days, codex);
      if (state.page === 'tokens') { const p = periodDays(); drawStackedBars($('#tokenBars'), p.values, p.labels); }
    }

    function renderPages() {
      const jobs = [['page-overview', renderOverview], ['page-tokens', renderTokens], ['page-settings', renderSettings]];
      jobs.forEach(([id, render]) => {
        try { render(); }
        catch (error) {
          const target = document.getElementById(id);
          if (target && !target.innerHTML.trim()) target.innerHTML = '<div class="card" style="color:var(--text-2)">此页面暂时无法加载</div>';
          console.error('QuotaMonitor page render failed:', id, error);
        }
      });
    }

    function showPanel(page = 'overview') {
      state.page = page;
      $('#dropdown').classList.add('hidden');
      $('#mainPanel').classList.remove('hidden');
      $$('.page').forEach(pageNode => pageNode.classList.toggle('active', pageNode.id === 'page-' + page));
      $$('.side-nav button').forEach(button => button.classList.toggle('active', button.dataset.page === page));
      $('#panelUpdated').textContent = '数据源更新于 ' + DATA.updated;
      requestAnimationFrame(drawCharts);
    }
    function showDropdown() { $('#mainPanel').classList.add('hidden'); $('#dropdown').classList.remove('hidden'); }
    function handleAction(action) {
      if (action === 'open') showPanel('overview');
      if (action === 'settings') showPanel('settings');
      if (action === 'refresh') { DATA.updated = new Date().toTimeString().slice(0,5); $('#panelUpdated').textContent = '数据源更新于 ' + DATA.updated; renderDropdown(); renderStatus(); }
      if (action === 'quit') { $('#dropdown').classList.add('hidden'); }
    }
    $('#statusButton').addEventListener('click', showDropdown);
    $('#statusButton').addEventListener('contextmenu', event => { event.preventDefault(); showDropdown(); });
    $$('.side-nav button').forEach(button => button.addEventListener('click', () => showPanel(button.dataset.page)));
    document.addEventListener('click', event => {
      if (!event.target.closest('#dropdown, #statusButton')) $('#dropdown').classList.add('hidden');
      const pageButton = event.target.closest('.side-nav button[data-page]');
      if (pageButton) showPanel(pageButton.dataset.page);
    });
    $('.traffic .close').addEventListener('click', () => $('#mainPanel').classList.add('hidden'));
    $('.traffic .min').addEventListener('click', () => $('#mainPanel').classList.add('hidden'));
    $('.traffic .max').addEventListener('click', () => $('#mainPanel').classList.toggle('maximized'));
    $('#titlebar').addEventListener('dblclick', () => $('#mainPanel').classList.toggle('hidden'));
    window.addEventListener('resize', drawCharts);

    // 系统栏实时时钟
    function tickClock() {
      const d = new Date();
      $('#sysClock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    tickClock(); setInterval(tickClock, 15000);

    renderStatus(); renderDropdown(); renderPages();
  </script>
</body>
</html>
