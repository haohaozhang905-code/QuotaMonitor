<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuotaMonitor 当前运行状态</title>
  <style>
    :root {
      color-scheme: light;
      --desktop: #dfe1e6;
      --desktop-deep: #cfd2d9;
      --bar: rgba(248, 248, 250, .84);
      --bar-text: #24242a;
      --background: #f6f6f7;
      --sidebar: #ececef;
      --surface: #fff;
      --surface-2: #f3f3f5;
      --surface-3: #e8e8ec;
      --border: #dadadd;
      --border-strong: #c9c9cd;
      --text: #19191c;
      --text-2: #696971;
      --text-3: #9a9aa2;
      --codex: #4278e7;
      --codex-deep: #3d4de4;
      --codex-soft: #e9effd;
      --claude: #d9784e;
      --claude-code: #c2602f;
      --deepseek: #4d6bfe;
      --workbuddy: #299a70;
      --ok: #2fa36b;
      --ok-soft: #e4f5ec;
      --shadow: 0 18px 48px rgba(26, 28, 36, .22), 0 3px 12px rgba(26, 28, 36, .12);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --desktop: #24252b;
      --desktop-deep: #18191d;
      --bar: rgba(29, 30, 34, .88);
      --bar-text: #f2f2f5;
      --background: #111214;
      --sidebar: #1a1b1f;
      --surface: #1d1f24;
      --surface-2: #24262c;
      --surface-3: #30333a;
      --border: #35363c;
      --border-strong: #46474f;
      --text: #f2f2f5;
      --text-2: #b0b0b8;
      --text-3: #787982;
      --codex: #7e9cff;
      --codex-deep: #6d89f5;
      --codex-soft: #263252;
      --claude: #e29570;
      --claude-code: #d97b4f;
      --deepseek: #7c93ff;
      --workbuddy: #50d09b;
      --ok: #43be82;
      --ok-soft: #173429;
      --shadow: 0 18px 48px rgba(0, 0, 0, .42), 0 3px 12px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 1120px; min-height: 760px; margin: 0; }
    body {
      overflow: hidden;
      background: var(--desktop);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      text-rendering: optimizeLegibility;
    }
    button { font: inherit; color: inherit; }
    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 760px;
      overflow: hidden;
      background:
        radial-gradient(900px 420px at 18% 28%, rgba(255,255,255,.32), transparent 68%),
        radial-gradient(780px 440px at 86% 82%, rgba(255,255,255,.26), transparent 72%),
        linear-gradient(135deg, var(--desktop), var(--desktop-deep));
    }
    .desktop:after {
      content: "";
      position: absolute;
      inset: 24px 0 0;
      pointer-events: none;
      opacity: .16;
      background: repeating-linear-gradient(115deg, transparent 0 82px, rgba(255,255,255,.2) 83px 84px, transparent 85px 166px);
      mix-blend-mode: overlay;
    }

    .system-bar {
      position: relative;
      z-index: 20;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      background: var(--bar);
      color: var(--bar-text);
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(16px);
    }
    .system-left, .system-right, .status-slots { display: flex; align-items: center; gap: 15px; }
    .apple { font-size: 15px; line-height: 1; }
    .app-name { font-weight: 650; }
    .status-button {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 22px;
      padding: 0 6px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: default;
      user-select: none;
    }
    .status-button:active { background: rgba(0,0,0,.05); }
    [data-theme="dark"] .status-button:active { background: rgba(255,255,255,.08); }
    .status-slot { display: flex; align-items: center; gap: 4px; color: var(--bar-text); font-variant-numeric: tabular-nums; }
    .status-icon { position: relative; width: 18px; height: 18px; display: inline-grid; place-items: center; }
    .status-icon svg { width: 100%; height: 100%; fill: #fff; }
    .status-icon.claude svg { width: 15px; height: 15px; }
    .status-icon .route-dot {
      position: absolute; top: 1px; right: -1px; width: 6px; height: 6px; border: 1px solid #fff; border-radius: 50%; background: var(--deepseek);
    }

    .workspace { position: relative; z-index: 2; width: 100%; height: calc(100% - 24px); }
    .dropdown {
      position: absolute;
      z-index: 12;
      top: 11px;
      right: 8px;
      width: 360px;
      max-height: calc(100vh - 40px);
      overflow: auto;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text);
      scrollbar-width: none;
    }
    .dropdown::-webkit-scrollbar { display: none; }
    .dropdown.hidden, .main-panel.hidden { display: none; }
    .dropdown-head { display: flex; align-items: baseline; justify-content: space-between; padding: 15px 14px 1px; }
    .dropdown-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .updated { color: var(--text-2); font-size: 10.5px; white-space: nowrap; }
    .hero { display: flex; align-items: baseline; gap: 8px; padding: 4px 14px 13px; }
    .hero-value { font-size: 34px; font-weight: 650; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .hero-label { color: var(--text-2); font-size: 10.5px; }
    .comparison { color: var(--claude); font-size: 10px; font-weight: 550; font-variant-numeric: tabular-nums; }
    .section-label { padding: 3px 14px; color: var(--text-2); font-size: 10px; font-weight: 700; letter-spacing: .02em; }
    .quota-line { display: grid; grid-template-columns: 100px 1fr 1fr; gap: 12px; padding: 8px 14px; }
    .quota-name { display: flex; gap: 8px; align-items: flex-start; }
    .quota-name .brand { width: 18px; height: 18px; margin-top: 1px; }
    .quota-name strong { display: block; font-size: 12.5px; font-weight: 650; }
    .quota-name small { display: block; margin-top: 3px; color: var(--text-2); font-size: 9.5px; }
    .metric { min-width: 0; }
    .metric-head { display: flex; justify-content: space-between; gap: 4px; align-items: baseline; }
    .metric-label { color: var(--text-2); font-size: 10.5px; }
    .metric-value { font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .metric-detail { margin-top: 4px; color: var(--text-2); font-size: 9.5px; white-space: nowrap; }
    .compact-row { display: grid; grid-template-columns: 1fr 70px 42px; gap: 8px; align-items: baseline; padding: 3px 14px; }
    .compact-row .name { overflow: hidden; color: var(--text-2); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
    .compact-row .amount, .compact-row .share { text-align: right; font-size: 10.5px; font-variant-numeric: tabular-nums; }
    .compact-row .share { color: var(--text-2); font-size: 9.5px; }
    .dropdown-actions { display: grid; gap: 1px; margin-top: 10px; padding: 5px 0; border-top: 1px solid var(--border); }
    .dropdown-action { width: 100%; padding: 8px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; font-size: 12px; }
    .dropdown-action:hover { background: var(--surface-2); }
    .dropdown-action.quit { color: var(--claude); }

    .main-panel {
      position: absolute;
      z-index: 10;
      top: 50%; left: 50%;
      width: 980px; height: 620px;
      transform: translate(-50%, -48%);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.16);
      border-radius: 11px;
      background: var(--background);
      box-shadow: var(--shadow);
    }
    .titlebar { height: 46px; display: flex; align-items: center; padding: 0 15px; background: transparent; cursor: default; }
    .traffic { display: flex; gap: 8px; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .traffic .close { background: #ff5f57; } .traffic .min { background: #febc2e; } .traffic .max { background: #28c840; }
    .titlebar-title { flex: 1; text-align: center; color: var(--text-2); font-size: 12px; font-weight: 550; }
    .titlebar-status { display: flex; align-items: center; gap: 5px; width: 102px; justify-content: flex-end; color: var(--text-2); font-size: 11px; }
    .health-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .panel-body { display: flex; width: 100%; height: calc(100% - 46px); }
    .sidebar { width: 182px; flex: 0 0 182px; display: flex; flex-direction: column; background: var(--sidebar); }
    .sidebar-brand { display: flex; align-items: center; gap: 9px; padding: 0 16px 14px; }
    .sidebar-brand .brand-tile { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--codex-soft); }
    .sidebar-brand .brand-tile .brand { width: 19px; height: 19px; }
    .sidebar-brand strong { font-size: 14px; font-weight: 650; }
    .side-nav { display: grid; gap: 3px; padding: 0 9px; }
    .side-nav button { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); text-align: left; cursor: pointer; font-size: 12px; }
    .side-nav button:hover { background: rgba(0,0,0,.07); }
    [data-theme="dark"] .side-nav button:hover { background: rgba(255,255,255,.07); }
    .side-nav button.active { background: var(--codex-soft); color: var(--codex-deep); font-weight: 650; }
    .side-nav .nav-symbol { width: 15px; text-align: center; font-size: 14px; }
    .connection { margin-top: auto; padding: 13px 16px 16px; border-top: 1px solid var(--border); }
    .connection strong { display: block; color: var(--text-2); font-size: 10.5px; font-weight: 650; }
    .connection small { display: block; margin-top: 3px; overflow: hidden; color: var(--text-3); font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }
    .panel-content { flex: 1; min-width: 0; overflow: auto; padding: 20px 22px 24px; scrollbar-width: none; }
    .panel-content::-webkit-scrollbar { display: none; }
    .page { display: none; }
    .page.active { display: block; }
    .page-heading { margin-bottom: 14px; }
    .page-heading h1 { margin: 0 0 4px; color: var(--text); font-size: 22px; line-height: 1.2; font-weight: 750; letter-spacing: -.4px; }
    .page-heading p { margin: 0; color: var(--text-2); font-size: 11.5px; }
    .page-heading p strong { margin-left: 6px; color: var(--codex); font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-bottom { display: grid; grid-template-columns: 1.06fr .94fr; gap: 14px; margin-top: 14px; }
    .card { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 16px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { color: var(--text); font-size: 13px; font-weight: 650; }
    .card-note { color: var(--text-3); font-size: 10px; white-space: nowrap; }
    .quota-card { min-width: 0; }
    .quota-card-top { display: flex; align-items: center; gap: 8px; }
    .quota-card-top .brand { width: 22px; height: 22px; }
    .quota-card-top .brand.claude { width: 20px; height: 20px; }
    .quota-card-top strong { display: block; font-size: 13px; font-weight: 650; }
    .quota-card-top small { display: block; margin-top: 2px; color: var(--text-3); font-size: 9px; }
    .status-pill { margin-left: auto; padding: 3px 7px; border-radius: 6px; background: var(--ok-soft); color: var(--ok); font-size: 9px; font-weight: 650; }
    .quota-facts { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 13px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .quota-facts .divider { background: var(--border); }
    .fact label { display: block; color: var(--text-3); font-size: 9px; }
    .fact strong { display: block; margin-top: 4px; color: var(--text); font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .fact small { display: block; margin-top: 2px; overflow: hidden; color: var(--text-2); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .trend-total { margin-top: 8px; color: var(--text); font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .canvas-wrap { height: 132px; margin-top: 2px; }
    canvas, .chart-svg { display: block; width: 100%; height: 100%; }
    .list-card { display: grid; gap: 10px; }
    .list-row { display: flex; align-items: baseline; gap: 8px; }
    .list-row .label { flex: 1; overflow: hidden; color: var(--text); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .amount { color: var(--text-2); font-size: 10px; font-variant-numeric: tabular-nums; }
    .list-row .share { width: 40px; color: var(--text-3); text-align: right; font-size: 9.5px; font-variant-numeric: tabular-nums; }
    .token-heading { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
    .token-heading .page-heading { flex: 1; margin: 0; }
    .period-picker { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--surface-3); }
    .period-picker button { padding: 5px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); cursor: pointer; font-size: 10px; }
    .period-picker button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.06); font-weight: 650; }
    .metric-strip { display: grid; grid-template-columns: 1.3fr repeat(4, 1fr); margin-bottom: 14px; overflow: hidden; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
    .metric-cell { min-width: 0; padding: 14px 15px; border-right: 1px solid var(--border); }
    .metric-cell:last-child { border-right: 0; }
    .metric-cell label { display: block; color: var(--text-3); font-size: 9.5px; font-weight: 550; }
    .metric-cell strong { display: block; overflow: hidden; margin-top: 4px; color: var(--text); font-size: 16px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .metric-cell:first-child strong { font-size: 21px; }
    .chart-card { margin-bottom: 14px; }
    .chart-subtitle { color: var(--text-3); font-size: 10px; }
    .chart-legend { display: flex; align-items: center; gap: 14px; margin-top: 7px; color: var(--text-2); font-size: 9.5px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .swatch { width: 8px; height: 8px; border-radius: 2px; }
    .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .rank-card { min-width: 0; }
    .rank-list { display: grid; gap: 12px; margin-top: 12px; }
    .rank-row { display: grid; grid-template-columns: 108px 1fr 54px 38px; align-items: center; gap: 8px; height: 17px; }
    .rank-row .name { overflow: hidden; font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .rank-track { height: 4px; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
    .rank-track i { display: block; height: 100%; border-radius: inherit; background: var(--codex); }
    .rank-row .num, .rank-row .pct { color: var(--text-2); text-align: right; font-size: 9.5px; font-variant-numeric: tabular-nums; }
    .heatmap-card { margin-bottom: 4px; }
    .heatmap-legend { display: flex; align-items: center; gap: 4px; color: var(--text-3); font-size: 9px; }
    .heatmap-legend i { width: 9px; height: 9px; border-radius: 2px; background: var(--surface); border: 1px solid var(--border); }
    .heatmap-legend i:nth-of-type(2) { background: color-mix(in srgb, var(--codex) 20%, var(--surface)); }
    .heatmap-legend i:nth-of-type(3) { background: color-mix(in srgb, var(--codex) 42%, var(--surface)); }
    .heatmap-legend i:nth-of-type(4) { background: color-mix(in srgb, var(--codex) 68%, var(--surface)); }
    .heatmap-legend i:nth-of-type(5) { background: var(--codex); }
    .heatmap { display: flex; gap: 7px; margin-top: 10px; }
    .weekday-labels { display: grid; grid-template-rows: repeat(7, 9px); gap: 3px; width: 19px; color: var(--text-3); font-size: 8px; }
    .heatmap-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); grid-auto-columns: 9px; gap: 3px; overflow: hidden; flex: 1; }
    .heat-cell { width: 9px; height: 9px; border-radius: 2px; background: var(--surface); border: 1px solid var(--border); }
    .heat-cell.l1 { background: color-mix(in srgb, var(--codex) 20%, var(--surface)); border-color: transparent; }
    .heat-cell.l2 { background: color-mix(in srgb, var(--codex) 42%, var(--surface)); border-color: transparent; }
    .heat-cell.l3 { background: color-mix(in srgb, var(--codex) 68%, var(--surface)); border-color: transparent; }
    .heat-cell.l4 { background: var(--codex); border-color: transparent; }
    .settings-card { max-width: 720px; overflow: hidden; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
    .settings-title { padding: 13px 15px; color: var(--text); font-size: 11px; font-weight: 650; border-bottom: 1px solid var(--border); }
    .setting-row { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 15px; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-copy { flex: 1; min-width: 0; }
    .setting-copy strong { display: block; font-size: 11.5px; font-weight: 550; }
    .setting-copy small { display: block; margin-top: 3px; color: var(--text-3); font-size: 9.5px; }
    .toggle { position: relative; width: 32px; height: 19px; flex: 0 0 32px; border: 0; border-radius: 99px; background: var(--surface-3); cursor: pointer; }
    .toggle:after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); transition: transform .15s ease; }
    .toggle.on { background: var(--codex); }
    .toggle.on:after { transform: translateX(13px); }
    .segmented { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--surface-3); }
    .segmented button { padding: 4px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); cursor: pointer; font-size: 11.5px; font-weight: 650; }
    .segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    @media (max-height: 760px) { .main-panel { transform: translate(-50%, -50%) scale(.94); } }
  </style>
</head>
<body>
  <div class="desktop" id="desktop">
    <header class="system-bar">
      <div class="system-left"><span class="apple">●</span><span class="app-name">QuotaMonitor</span><span>编辑</span><span>显示</span><span>窗口</span><span>帮助</span></div>
      <div class="system-right"><span>14:30</span><button class="status-button" id="statusButton" aria-label="QuotaMonitor 状态栏按钮"></button></div>
    </header>
    <main class="workspace">
      <aside class="dropdown" id="dropdown" aria-label="QuotaMonitor 下拉框"></aside>
      <section class="main-panel hidden" id="mainPanel" aria-label="QuotaMonitor 主面板">
        <div class="titlebar" id="titlebar"><div class="traffic"><i class="close"></i><i class="min"></i><i class="max"></i></div><div class="titlebar-title">QuotaMonitor</div><div class="titlebar-status"><span class="health-dot"></span><span id="panelUpdated">更新于 14:30</span></div></div>
        <div class="panel-body">
          <aside class="sidebar">
            <div style="height:46px"></div>
            <div class="sidebar-brand"><span class="brand-tile"><span class="brand" data-brand="codex"></span></span><strong>QuotaMonitor</strong></div>
            <nav class="side-nav">
              <button class="active" data-page="overview"><span class="nav-symbol">⌂</span><span>概览</span></button>
              <button data-page="tokens"><span class="nav-symbol">▥</span><span>Token 看板</span></button>
              <button data-page="settings"><span class="nav-symbol">☷</span><span>设置</span></button>
            </nav>
            <div class="connection"><strong>连接正常</strong><small>本地数据源已连接</small></div>
          </aside>
          <section class="panel-content" id="panelContent">
            <div class="page active" id="page-overview"></div>
            <div class="page" id="page-tokens"></div>
            <div class="page" id="page-settings"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

      $('#launchToggle').addEventListener('click', () => { state.launch = !state.launch; renderSettings(); }); $$('.segmented button').forEach(button => button.addEventListener('click', () => { state.language = button.dataset.lang; renderSettings(); }));
    }
    function drawCharts() { if ($('#mainPanel').classList.contains('hidden')) return; const codex = getComputedStyle(document.documentElement).getPropertyValue('--codex').trim(); if (state.page === 'overview') drawSparkline($('#overviewSpark'), DATA.days, codex); if (state.page === 'tokens') { const p = periodDays(); drawBars($('#tokenBars'), p.values, p.labels); } }
    function renderPages() {
      const jobs = [
        ['page-overview', renderOverview],
        ['page-tokens', renderTokens],
        ['page-settings', renderSettings]
      ];
      jobs.forEach(([id, render]) => {
        try {
          render();
        } catch (error) {
          const target = document.getElementById(id);
          if (target && !target.innerHTML.trim()) {
            target.innerHTML = '<div class="card" style="color:var(--text-2)">此页面暂时无法加载</div>';
          }
          console.error('QuotaMonitor page render failed:', id, error);
        }
      });
    }
    function showPanel(page = 'overview') { state.page = page; $('#dropdown').classList.add('hidden'); $('#mainPanel').classList.remove('hidden'); $$('.page').forEach(pageNode => pageNode.classList.toggle('active', pageNode.id === 'page-' + page)); $$('.side-nav button').forEach(button => button.classList.toggle('active', button.dataset.page === page)); $('#panelUpdated').textContent = '更新于 ' + DATA.updated; requestAnimationFrame(drawCharts); }
    function showDropdown() { $('#mainPanel').classList.add('hidden'); $('#dropdown').classList.remove('hidden'); }
    function handleAction(action) { if (action === 'open') showPanel('overview'); if (action === 'settings') showPanel('settings'); if (action === 'refresh') { DATA.updated = new Date().toTimeString().slice(0,5); $('#panelUpdated').textContent = '更新于 ' + DATA.updated; renderDropdown(); } if (action === 'quit') { $('#dropdown').classList.add('hidden'); } }
    $('#statusButton').addEventListener('click', showDropdown); $('#statusButton').addEventListener('contextmenu', event => { event.preventDefault(); showDropdown(); });
    $$('.side-nav button').forEach(button => button.addEventListener('click', () => showPanel(button.dataset.page)));
    document.addEventListener('click', event => {
      const pageButton = event.target.closest('.side-nav button[data-page]');
      if (pageButton) showPanel(pageButton.dataset.page);
    });
    $('#titlebar').addEventListener('dblclick', () => $('#mainPanel').classList.toggle('hidden'));
    window.addEventListener('resize', drawCharts);
    renderStatus(); renderDropdown(); renderPages();
  </script>
</body>
</html>
