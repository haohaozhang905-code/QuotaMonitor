name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare check dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Swift version
        run: swift --version
      - name: SDD documentation contract
        run: ./script/verify_sdd_docs.sh
      - name: Sensitive data audit
        run: ./script/security_check.sh
      - name: Test
        run: swift test
